<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Work Hub — centro de operaciones de Rodrigo">
<title>Work Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="deck">

  <header class="masthead">
    <div class="masthead-left">
      <span class="mark">WH</span>
      <div>
        <div class="brand">WORK HUB</div>
        <div class="brand-sub">panel operativo — Rodrigo</div>
      </div>
    </div>
    <div class="masthead-right">
      <span class="clock" id="clock">--:--:--</span>
      <span class="pulse"><i></i>en línea</span>
    </div>
  </header>

  <section class="parte">
    <div class="parte-label">PARTE DIARIO · <span id="today"></span></div>
    <h1>Todo lo que armaste para laburar,<br>en un solo lugar.</h1>
    <p class="parte-text">Este panel no hace el trabajo. Organiza, muestra y conecta las herramientas que ya lo hacen.</p>
  </section>

  <section class="block">
    <div class="block-head">
      <h2>Sistemas</h2>
      <span class="block-count" id="project-count"></span>
    </div>
    <div class="grid" id="projects"></div>
  </section>

  <section class="block">
    <div class="block-head">
      <h2>En construcción</h2>
      <span class="block-sub">work assistant</span>
    </div>
    <div class="future-row" id="future"></div>
  </section>

  <footer class="statusbar" id="statusbar"></footer>

</div>
<script src="app.js"></script>
</body>
</html>
